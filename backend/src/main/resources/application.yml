spring:
  application:
    name: medcare-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medcare}
    username: ${DB_USERNAME:medcare}
    password: ${DB_PASSWORD:medcare_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # Invariant 5: Zero-Binary Backend Media Pipeline (disable multipart upload handling)
      enabled: false

medcare:
  storage:
    provider: cloudflare-r2
    r2:
      account-id: ${R2_ACCOUNT_ID:your-cloudflare-account-id}
      endpoint: ${R2_ENDPOINT:https://${R2_ACCOUNT_ID:your-cloudflare-account-id}.r2.cloudflarestorage.com}
      region: ${R2_REGION:auto}
      bucket-name: ${R2_BUCKET_NAME:medcare-clinical-media}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      presigned-put-ttl-minutes: ${R2_PRESIGNED_PUT_TTL_MINUTES:15}
      presigned-get-ttl-minutes: ${R2_PRESIGNED_GET_TTL_MINUTES:5}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
